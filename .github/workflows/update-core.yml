name: Update NextTrace core
on:
  schedule:
    - cron: '23 19 * * *' # 03:23 Asia/Shanghai, every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-nexttrace-core
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check updater
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Refresh stable release and architecture hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-core.py
      - name: Commit updated pins
        shell: bash
        run: |
          if git diff --quiet -- open-nexttrace-core/version.mk; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add open-nexttrace-core/version.mk
          git commit -m "chore(core): update NextTrace release and SHA-256 pins"
          git push
