name: Build OpenWrt packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64-24.10.0, aarch64_cortex-a53-24.10.0, mipsel_24kc-24.10.0]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: open_nexttrace
          PACKAGES: open-nexttrace-core luci-app-open_nexttrace
          V: s
          NO_SHFMT_CHECK: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: open-nexttrace-${{ matrix.arch }}
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
            logs/**
          if-no-files-found: error
