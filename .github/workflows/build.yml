name: Build OpenWrt packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.release.format }} ${{ matrix.arch }} ${{ matrix.release.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mipsel_24kc
        release:
          - version: '25.12.5'
            format: apk
          - version: '24.10.8'
            format: ipk
    steps:
      - uses: actions/checkout@v4
      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release.version }}
          FEEDNAME: open_nexttrace
          PACKAGES: open-nexttrace-core luci-app-open_nexttrace
          V: s
          NO_SHFMT_CHECK: '1'
      - name: Verify ${{ matrix.release.format }} packages
        shell: bash
        run: |
          mapfile -t packages < <(find bin/packages -type f -name '*.${{ matrix.release.format }}')
          if (( ${#packages[@]} == 0 )); then
            echo "No ${{ matrix.release.format }} package was produced" >&2
            exit 1
          fi
          printf '%s\n' "${packages[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: open-nexttrace-${{ matrix.release.format }}-${{ matrix.arch }}-${{ matrix.release.version }}
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
            logs/**
          if-no-files-found: error
