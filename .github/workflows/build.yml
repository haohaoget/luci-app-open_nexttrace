name: Build OpenWrt packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.release.format }} ${{ matrix.arch }} ${{ matrix.release.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mipsel_24kc
        release:
          - version: '25.12.5'
            format: apk
          - version: '24.10.8'
            format: ipk
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p bin dl
          chmod -R a+rwx bin dl
      - name: Pull the official OpenWrt SDK
        shell: bash
        run: docker pull "ghcr.io/openwrt/sdk:${{ matrix.arch }}-V${{ matrix.release.version }}"
      - name: Build with the official OpenWrt SDK
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/bin:/builder/bin" \
            -v "${GITHUB_WORKSPACE}/dl:/builder/dl" \
            -e TERM=xterm \
            "ghcr.io/openwrt/sdk:${{ matrix.arch }}-V${{ matrix.release.version }}" \
            bash /workspace/scripts/build-openwrt-packages.sh \
              "${{ matrix.release.format }}" \
              "${{ matrix.arch }}"
      - name: Verify ${{ matrix.release.format }} packages
        shell: bash
        run: |
          for package in open-nexttrace-core luci-app-open_nexttrace; do
            mapfile -t files < <(find bin/packages -type f -name "${package}*.${{ matrix.release.format }}")
            if (( ${#files[@]} == 0 )); then
              echo "No ${{ matrix.release.format }} package was produced for ${package}" >&2
              exit 1
            fi
            printf '%s\n' "${files[@]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: open-nexttrace-${{ matrix.release.format }}-${{ matrix.arch }}-${{ matrix.release.version }}
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
            logs/**
          if-no-files-found: error
